[project]
name = "kindle-to-pdf"
version = "0.1.0"
description = "Capture Kindle app pages as screenshots and compile them into a PDF (macOS and Windows)"
requires-python = ">=3.12"
dependencies = [
    "ocrmypdf>=17.6.0",
    "pillow>=10.0.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
kindle-to-pdf = "kindle_to_pdf:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kindle_to_pdf"]

[tool.ty.environment]
python = ".venv"
